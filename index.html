<style>

header{background:#285782;color:#fff;padding:20px 16px;box-shadow:0 2px 7px #0002;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:28px;letter-spacing:.04em}h2{margin:5px 0 0;font-size:15px;font-weight:700;letter-spacing:.09em;color:#dce8f3}
main{max-width:900px;margin:auto;padding:16px 14px 95px}.section{font-size:14px;font-weight:900;letter-spacing:.12em;color:#667582;margin:14px 2px 9px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{width:100%;background:#fff;border:1px solid #d5dde4;border-radius:16px;padding:16px 14px;text-align:left;color:#183b5d;font-size:17px;font-weight:850;box-shadow:0 1px 2px #0001}
.big:active{transform:scale(.99)}.back{border:0;background:#e7edf2;color:#183b5d;border-radius:11px;padding:10px 14px;font-weight:850;margin-bottom:9px}.reset{border:1px solid #e0b1b1;background:#fff5f5;color:#b32929;border-radius:11px;padding:10px 14px;font-weight:850;margin:0 0 12px 6px}
.check{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #d5dde4;border-radius:13px;padding:9px 11px;margin:6px 0;min-height:52px;color:#17324a;font-size:16px}
.check input{width:24px;height:24px;flex:0 0 24px;accent-color:#285782}.check.done{opacity:.5;text-decoration:line-through}
.card{background:#fff;border:1px solid #d5dde4;border-radius:15px;padding:16px;margin:9px 0;box-shadow:0 1px 2px #0001}.card b{display:block;font-size:17px;margin-bottom:6px}.muted{color:#657582;font-size:13px}
.danger{border-left:5px solid #c93434}.warn{border-left:5px solid #d79b22}.note{background:#eef3f7;border-radius:12px;padding:11px;margin-top:12px;color:#5c6c77;font-size:13px}
.quickref{background:#fff;border:1px solid #d5dde4;border-radius:14px;overflow:hidden}.qr{display:grid;grid-template-columns:46% 54%;padding:11px 13px;border-bottom:1px solid #e2e7eb;font-size:15px;line-height:1.25}.qr:last-child{border-bottom:0}.qr>div{color:#536572}.qr strong{color:#183b5d;font-weight:800}.refgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.refgrid .card{margin:0;min-height:72px;display:flex;flex-direction:column;justify-content:center}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #d5dde4;padding:9px;display:flex;gap:7px;z-index:8}.bottom button{flex:1;border:1px solid #e0b1b1;background:#fff5f5;color:#b32929;border-radius:11px;padding:11px 3px;font-weight:900}
@media(max-width:600px){.grid,.refgrid{grid-template-columns:1fr}.qr{grid-template-columns:43% 57%;font-size:14px}.big{padding:15px}.check{font-size:16px}}
</style>
</head>

let aircraft=null;
const app=document.getElementById("app");
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function home(){aircraft=null;document.getElementById("title").textContent="DIGITAL CHECKLIST";document.getElementById("sub").textContent="SELECT AIRCRAFT";app.innerHTML=`<div class="section">AIRCRAFT</div><div class="grid">
<button class="big" onclick="openAircraft('C210')">C210</button>
<button class="big" onclick="openAircraft('C310')">C310</button>
<button class="big" onclick="openAircraft('C310 TURBO')">C310 TURBO</button>
<button class="big" onclick="openAircraft('C402')">C402</button></div>`}
function openAircraft(a){aircraft=a;document.getElementById("title").textContent=a;document.getElementById("sub").textContent="AIRCRAFT CHECKLIST";renderAircraft()}
function renderAircraft(){let d=F[aircraft];app.innerHTML=`<button class="back" onclick="home()">← BACK</button>
<div class="section">CHECKLISTS</div><div class="grid">${Object.keys(d.normal).map(k=>`<button class="big" onclick="showChecklist('${esc(k)}')">${esc(k)}</button>`).join("")}</div>
<div class="section">AIRCRAFT DATA</div><div class="grid">${Object.keys(d.refs).map(k=>`<button class="big" onclick="showRef('${esc(k)}')">${esc(k)}</button>`).join("")}</div>
${aircraft==="C402"?`<div class="section">SURVEY</div><div class="grid"><button class="big" onclick="showTrouble()">SURVEY TROUBLESHOOTING</button></div>`:""}
<div class="section">EMERGENCY</div><div class="grid"><button class="big" onclick="showEmergency()">EMERGENCY PROCEDURES</button></div>`}
function showChecklist(k){
let items=F[aircraft].normal[k]||[];
app.innerHTML=`<div><button class="back" onclick="renderAircraft()">← BACK</button><button class="reset" onclick="resetChecklist()">RESET</button></div>
<div class="section">${esc(k)}</div>
<div id="checklistBody">${items.map((x,i)=>`<label class="check"><input type="checkbox"><span>${i+1}. ${esc(x)}</span></label>`).join("")}</div>`;
}
function resetChecklist(){
document.querySelectorAll("#checklistBody input[type=checkbox]").forEach(cb=>{cb.checked=false;cb.closest(".check").classList.remove("done")});
}
function showRef(k){
let items=F[aircraft].refs[k]||[];
app.innerHTML=`<button class="back" onclick="renderAircraft()">← BACK</button><div class="section">${esc(k)}</div><div class="quickref">${items.map(x=>{let p=x.split(" — ");return `<div class="qr"><div>${esc(p[0])}</div><strong>${esc(p.slice(1).join(" — "))}</strong></div>`}).join("")}</div>`}
function showTrouble(){app.innerHTML=`<button class="back" onclick="renderAircraft()">← BACK</button><div class="section">SURVEY TROUBLESHOOTING</div>${F.C402.trouble.map(x=>`<div class="card warn"><b>${esc(x)}</b></div>`).join("")}<div class="note">Working reference based on the survey-system behaviour you supplied. Confirm against current system/operator procedures.</div>`}

"Forced Landing Without Power":["1. Mixtures — IDLE CUT OFF","2. Propellers — FEATHER","3. Fuel Selectors — OFF","4. All Switches Except Battery — OFF","5. Approach — 111 KIAS","6. If Smooth and Hard Surface: a. Landing Gear DOWN within gliding distance of field; b. Wing Flaps AS REQUIRED; c. Battery Switch OFF; d. Cabin Door UNLATCH prior to flare; e. Normal Landing INITIATE; Keep nose wheel off ground as long as practical","7. If Rough or Soft Surface: a. Select a smooth grass-covered runway if possible; b. Landing Gear UP; c. Wing Flaps DOWN 15 degrees; d. Battery Switch OFF; e. Cabin Door UNLATCH prior to flare out; f. Landing Attitude TAIL LOW"],
"Fire On Ground":["1. Throttles — CLOSED","2. Brakes — AS REQUIRED","3. Mixtures — IDLE CUT OFF","4. Battery — OFF (Use Gang Bar)","5. Magnetos — OFF (Use Gang Bar)","6. EVACUATE AIRPLANE AS SOON AS PRACTICAL"],
"Inflight Wing or Engine Fire":["1. Both Auxiliary Fuel Pumps — OFF","2. Appropriate Engine — SECURE","3. Throttle — CLOSE","4. Mixture — IDLE CUT OFF","5. Propeller — FEATHER","6. Fuel Selector — OFF (Feel for Detent)","7. Magnetos — OFF","8. Alternator — OFF","9. Cowl Flap — CLOSED","10. Cabin Heater — OFF","11. LAND AND EVACUATE AS SOON AS PRACTICAL"],
"Inflight Cabin or Smoke":["1. Electrical Load — REDUCE to minimum required","2. Attempt to isolate the source of the fire or smoke","3. Vents — OPEN","4. Cabin Air Controls — OPEN all vents including windshield defrost; CLOSE if intensity of smoke increases"],
"Landing Gear Will Not Extend":["1. Landing Gear Motor Circuit Breaker — CHECK IN with landing gear selected down","2. Gear Down Light — CHECK BULB","3. Landing Gear Motor Circuit Breaker — PULL","4. Landing Gear Switch — NEUTRAL (Centre)","5. Pilots Seat — ADJUST AS REQUIRED","6. Hand Crank — EXTENDED AND LOCKED","7. Rotate Crank — CLOCKWISE four turns past gear down lights on (approx. 52 turns)","8. Gear Down Light — ON; Unlocked Light OFF","9. Gear Warning Horn — CHECK","10. Hand crank — PUSH BUTTON and STOW","11. As Soon As Practical — LAND"],

"Alternator Failure (Single)":["Indicated By Illumination Of Failure Light","1. Electrical Load — REDUCE","2. If Circuit Breaker is Tripped: a. Turn off affected alternator; b. Reset affected alternator circuit breaker; c. Turn on affected alternator switch; d. If circuit breaker reopens, turn off alternator","3. If Circuit Breaker does not Trip: a. Select affected alternator on voltammeter and monitor output; b. If output is normal and failure light remains on, disregard fail indication and have indicator checked after landing; c. If output is insufficient, turn off alternator and reduce electrical load to one alternator capacity; d. If complete loss of alternator output occurs, check field fuse and replace if necessary; e. If intermittent light indication accompanied by voltammeter fluctuation is observed, turn off affected alternator and reduce load to one alternator capacity."],
"Alternator Failure (Dual)":["Indicated By Illumination Of Failure Lights And Low Voltage Light","1. Electrical Load — REDUCE","2. If Circuit Breakers are Tripped: a. Turn off alternators; b. Reset circuit breakers; c. Turn on left alternator and monitor output on voltammeter; d. If alternator is charging, leave it on. Disregard failure; e. If still inoperative, turn off left alternator; f. Repeat steps c through e for right alternator; g. If circuit breakers reopen, prepare to terminate flight","3. If Circuit Breakers have not Tripped: a. Turn off alternators; b. Check field fuses and replace as required; c. Turn on left alternator and monitor output on voltammeter; d. If alternator is charging, leave it on. Disregard failure; e. If still inoperative, turn off left alternator; f. Repeat steps c through e for right alternator; g. If both still inoperative, turn off alternators and turn on emergency alternator field switch; h. Repeat steps c through e for each alternator; i. If still inoperative, turn off alternator and prepare to terminate flight"]},

function showEmergency(){
let items=F[aircraft].emergency||[];
app.innerHTML=`<button class="back" onclick="renderAircraft()">← BACK</button><div class="section">EMERGENCY PROCEDURES</div>
${items.map(x=>`<button class="big danger" style="margin:5px 0" onclick="showEmergencyDetail('${esc(x)}')">${esc(x)}</button>`).join("")}`;}
function showEmergencyDetail(name){
let d=(emergencyDetail[aircraft]||{})[name]||["Source material required for this emergency procedure."];
app.innerHTML=`<div><button class="back" onclick="showEmergency()">← BACK</button><button class="reset" onclick="resetChecklist()">RESET</button></div><div class="section">${esc(name)}</div>
<div id="checklistBody">${d.map((x,i)=>`<label class="check"><input type="checkbox"><span>${esc(x)}</span></label>`).join("")}</div>`}
function showEmergencyCategory(cat){
let groups={ENGINE:["Engine Secure Procedure","Air start","Engine Failure After Take-Off","Engine Failure During Flight","Engine Inoperative Landing","Both Engines Failure","Forced Landing With Power","Forced Landing Without Power","Engine Failure During Takeoff Run","Engine Failure Immediately After Takeoff","Emergency Landing Without Engine Power","Precautionary Landing With Engine Power","In-Flight Engine Restart"],FIRE:["Fire On Ground","Inflight Wing or Engine Fire","Inflight Cabin or Smoke","During Start on Ground","Engine Fire In Flight","Electrical Fire In Flight","Cabin Fire","Wing Fire"],GEAR:["HYD Press Light Illuminated After Gear Cycle","Landing Gear Will Not Extend","Landing Gear Will Not Retract","Landing Gear Fails To Retract","Landing Gear Fails to Extend","Gear Up Landing","Landing Without Positive Indication Of Gear Locking"],ELECTRICAL:["Alternator Failure (Single)","Alternator Failure (Dual)","Electrical Fire In Flight"]};
let all=(F[aircraft].emergency||[]).filter(x=>(groups[cat]||[]).includes(x));
app.innerHTML=`<button class="back" onclick="renderAircraft()">← BACK</button><div class="section">${cat} EMERGENCY</div>${all.map(x=>`<button class="big danger" style="margin:5px 0" onclick="showEmergencyDetail('${esc(x)}')">${esc(x)}</button>`).join("")}`;
}
