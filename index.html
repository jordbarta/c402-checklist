<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#234E7D">
<title>C402C Digital Checklist</title>
<style>
:root{--blue:#234E7D;--pblue:#EAF1F8;--red:#C91C24;--pred:#FBE9EA;--text:#15181B;--muted:#68727C;--line:#D6DADF;--yellow:#FFF4CF;--green:#EAF3E6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f5f6f7;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,label{font-family:inherit}
#app{max-width:900px;margin:auto;min-height:100vh;padding-bottom:88px}
header{background:var(--blue);color:white;padding:16px 18px 15px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px #0002}
header.red{background:var(--red)}
h1{font-size:23px;line-height:1.05;margin:0;font-weight:900;letter-spacing:.01em}
.sub{font-size:11px;opacity:.82;margin-top:5px;font-weight:800;letter-spacing:.08em}
main{padding:16px}
.section{font-size:12px;color:var(--muted);font-weight:900;letter-spacing:.12em;margin:9px 2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{min-height:76px;border:1px solid var(--line);border-radius:17px;background:#fff;font-size:16px;font-weight:900;color:var(--blue);padding:12px}
.big.data{min-height:64px}
.big:active,.tool:active,.em:active{transform:scale(.985)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.back,.tool{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;font-weight:900;color:var(--blue);font-size:14px}
.tool.reset{color:var(--red)}
.progress{font-size:12px;color:var(--muted);font-weight:900;margin-bottom:13px;display:flex;justify-content:space-between;gap:10px}
.progressbar{height:7px;background:#e7eaed;border-radius:99px;overflow:hidden;margin-bottom:14px}
.progressbar span{display:block;height:100%;background:var(--blue);width:0%;transition:width .2s}
.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{display:block;min-height:120px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;position:relative;text-align:left;cursor:pointer;user-select:none;box-shadow:0 1px 2px #0000000a}
.card input{position:absolute;right:13px;top:13px;width:31px;height:31px;accent-color:var(--blue);pointer-events:none}
.card .label{font-size:16px;font-weight:950;padding-right:42px;line-height:1.12}
.card .value{font-size:15px;font-weight:850;color:var(--blue);margin-top:12px;line-height:1.2;padding-right:2px}
.card.done{background:var(--green);border-color:#b8cdb0}
.card.done .label,.card.done .value{opacity:.58;text-decoration:line-through}
.single{grid-template-columns:1fr}
.single .card{min-height:94px}
.single .card .label{font-size:18px}
.single .card .value{font-size:17px;margin-top:9px}
.emergency-title{background:var(--pred);border:1px solid #e3b4b7;color:var(--red);font-size:12px;font-weight:950;border-radius:12px;padding:10px 12px;margin-bottom:12px}
.embar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:9px 8px calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:7px;z-index:20}
.em{min-height:50px;border:1px solid #e2b2b5;border-radius:13px;background:var(--pred);color:var(--red);font-weight:950;font-size:12px}
.hero{background:#fff;border:1px solid var(--line);border-radius:20px;padding:25px;text-align:center}
.hero .num{font-size:52px;font-weight:950;color:var(--blue);line-height:1.05;margin:7px 0}
.row{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:8px;display:flex;justify-content:space-between;gap:12px;font-size:15px;font-weight:850}
.row b{color:var(--blue);text-align:right}
.powercard{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:11px}
.powercard .phase{font-size:12px;font-weight:950;color:var(--blue);letter-spacing:.06em}
.powercard .mp{font-size:23px;font-weight:950;margin-top:4px}
.powercard .detail{font-size:13px;color:var(--muted);font-weight:750;margin-top:5px;line-height:1.25}
.note{background:var(--yellow);border-radius:14px;padding:14px;font-size:12px;font-weight:800;line-height:1.35;margin-top:14px}
@media(max-width:650px){.card .label{font-size:15px}.card .value{font-size:14px}}
@media(min-width:800px){#app{max-width:980px}main{padding:20px}.card{min-height:128px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="embar">
<button class="em" onclick="openEmergency(0)">ENG FAIL</button>
<button class="em" onclick="openEmergency(3)">FIRE</button>
<button class="em" onclick="openEmergency(4)">GEAR</button>
<button class="em" onclick="openEmergency(5)">ELEC</button>
</div>
<script>
const DATA={"normal": {"PRE-FLIGHT / START": [["Pre-flight", "COMPLETE"], ["Cabin Doors", "LATCHED & SECURE"], ["Crew Doors", "CLOSED & LOCKED"], ["Controls Locks", "REMOVE"], ["Seats / Belts / Harnesses", "ADJUST & SECURE"], ["Fuel Selectors", "MAIN TANKS"], ["Landing Gear Switch", "DOWN"], ["Mixtures / Props / Throttles", "SET"], ["Switches / CBs", "SET"], ["Battery & Alternators", "ON"], ["Gear Position Lights", "CHECK GREEN"], ["Annunciator Panel", "PRESS TO TEST"], ["Lights", "AS REQUIRED"], ["Propellers", "CLEAR"], ["Mags", "ON"], ["Engines", "START"], ["Starter Button", "PRESS"], ["Primer", "L ENGINE / R ENGINE"], ["Aux Fuel Pump", "LOW"], ["Throttle", "800–1000 RPM"], ["Engine Instruments", "CHECK"], ["Repeat", "RIGHT ENGINE"], ["Fuel Pump", "OFF"]], "TAXI": [["Avionics Bus Switch", "ON"], ["Avionics", "SET"], ["Lights", "AS REQUIRED"], ["Cabin Temp", "AS REQUIRED"], ["Heating / Defrost", "Air OPEN • Defrost AS REQ • Temp OPEN • HEAT"], ["Ventilation", "Air OPEN • HEAT switch FAN"], ["Brakes", "RELEASE"], ["Throttles", "AS REQUIRED"], ["Brakes", "CHECK"], ["Gyros", "CHECK"], ["Compass", "CHECK"], ["TC", "CHECK"]], "BEFORE TAKEOFF": [["Fuel Quantity", "CHECK"], ["Fuel Selectors", "MAIN TANKS"], ["Emergency Cross Feed", "CHECK OPEN"], ["Cowl Flaps", "OPEN"], ["Trim Tabs", "SET"], ["Wing Flaps", "UP"], ["Avionics / Radios", "SET"], ["Flight Instruments", "SET"], ["Alternate Air", "IN"], ["Aux Fuel Pumps", "LOW"], ["Flight Controls", "CHECK"], ["Run-up Throttles", "1700"], ["L & R HYD FLOW lights", "OFF"], ["Alternators", "CHECK"], ["Vacuum System", "CHECK"], ["Mags", "CHECK"], ["Propellers", "CHECK"], ["Mixtures", "CHECK"], ["Engine Instruments", "CHECK"], ["Throttles", "1000 RPM"], ["Quadrant Friction Lock", "ADJUST"], ["Exterior Lights", "AS REQUIRED"], ["Ice Protection", "AS REQUIRED"], ["Doors / Windows", "CLOSED"], ["Annunciator Panel", "CHECK"], ["Seat Belts / Harness", "SECURE"]], "TAKEOFF": [["Power", "SET FOR TAKEOFF"], ["Mixtures", "CHECK FUEL FLOWS IN WHITE ARC"], ["Engine Instruments", "CHECK"], ["Minimum control speed", "80 KIAS"], ["To 50 ft", "95 KIAS"], ["After T/O — Gear", "RETRACT"], ["Fuel Pumps", "OFF"], ["Lights", "AS REQUIRED"], ["Cruise Climb", "115–130 KIAS"]], "CLIMB / CRUISE": [["CLIMB — Power", "SET"], ["Mixtures", "ADJUST"], ["Cowl Flaps", "AS REQUIRED"], ["CRUISE — Power", "SET"], ["Mixtures", "LEAN"], ["Cowl Flaps", "CLOSE"], ["Props", "SYNC"], ["Trim Tabs", "ADJUST"]], "DESCENT / LANDING": [["DESCENT — Fuel Selectors", "MAIN TANKS"], ["Power", "AS REQUIRED"], ["Mixtures", "ADJUST"], ["Cowl Flaps", "CLOSE"], ["Altimeter", "SET"], ["Seat Belts / Harness", "SECURE"], ["Wing Flaps", "AS REQUIRED"], ["Landing Gear", "DOWN"], ["Mixtures", "ADJUST"], ["Aux Fuel Pumps", "LOW"], ["Propellers", "FULL FORWARD"], ["Approach Speed", "95 KIAS @ 6850 lb"], ["AFTER LANDING — Aux Pumps", "OFF"], ["Cowl Flaps", "OPEN"], ["Wing Flaps", "UP"]], "SECURE": [["Parking Brake", "SET if brakes are cool"], ["Accessory Switches", "OFF"], ["Aux Fuel Pumps", "OFF"], ["Engines", "SHUT DOWN"], ["Battery / Alternator / Mags", "OFF"], ["Aircraft", "SECURE"]]}, "emergency": {"ENGINE FAILURE": [["Immediate priority", "FLY THE AIRCRAFT"], ["Failure during flight", "DETERMINE INOP ENGINE"], ["Operative engine", "ADJUST AS REQUIRED"], ["Fuel Flow", "CHECK; if deficient AUX PUMPS ON"], ["Fuel Selectors", "MAIN TANKS — FEEL FOR DETENT"], ["Fuel Quantity", "CHECK"], ["Oil Pressure / Oil Temp", "CHECK"], ["Magneto Switches", "CHECK ON"], ["Mixture", "ADJUST / LEAN AS REQUIRED"], ["If engine does not start", "SECURE"], ["Throttle", "CLOSE"], ["Mixture", "IDLE CUT-OFF"], ["Propeller", "FEATHER"], ["Fuel Selector", "OFF — FEEL FOR DETENT"], ["Aux Fuel Pump", "OFF"], ["Magneto Switches", "OFF"], ["Alternator", "OFF"], ["Cowl Flap", "CLOSE"], ["Operative Engine Power", "AS REQUIRED"], ["Mixture", "ADJUST FOR POWER"], ["Fuel Selector", "AS REQUIRED — FEEL FOR DETENT"], ["Aux Fuel Pump", "ON"], ["Cowl Flap", "AS REQUIRED"]], "ENGINE FAILURE AFTER T/O": [["Condition", "Above 95 KIAS / gear UP or in transit"], ["Mixtures", "FULL RICH"], ["Propellers", "FULL FORWARD"], ["Throttles", "FULL FORWARD — 39.0 in"], ["Landing Gear", "CHECK UP"], ["Inoperative Engine — Throttle", "CLOSE"], ["Mixture", "IDLE CUT-OFF"], ["Propeller", "FEATHER"], ["Bank", "5° TOWARD OPERATIVE ENGINE"], ["Clear 50 ft obstacles", "95 KTS"], ["Climb", "104 KTS — VYSE"], ["Trim Tabs", "5° BANK TOWARD OPERATIVE ENGINE / ~½ BALL SLIP"], ["Cowl Flap", "CLOSE"], ["Fuel Selector", "OFF — FEEL FOR DETENT"], ["Aux Fuel Pump", "OFF"], ["Magnetos", "OFF"], ["Alternator", "OFF"], ["Land", "ASAP"]], "AIR START": [["Aircraft", "WITHOUT PROPELLER UNFEATHER SYSTEM"], ["Aux Fuel Pump", "CHECK OFF"], ["If ON — purge", "Pump OFF • Mixture ICO • Throttle fuel OPEN • Mags OFF • rotate 15 times"], ["Magnetos", "ON"], ["Fuel Selector", "MAIN TANK — FEEL FOR DETENT"], ["Throttle", "FORWARD ~1½ in"], ["Mixture", "FULL RICH THEN RETARD ~2 in"], ["Propeller", "FORWARD OF DETENT"], ["Starter", "PRESS"], ["Primer", "ACTIVATE"], ["Starter / Primer", "RELEASE WHEN ENGINE FIRES"], ["Aux Fuel Pump", "LOW"], ["Mixture", "ADJUST FOR SMOOTH OPERATION"], ["Power", "INCREASE AFTER CHT 200°F; gradual mixture increase"], ["Cowl Flap", "AS REQUIRED"], ["Alternator", "ON"]], "FORCED LANDING": [["WITH POWER — Site", "CHECK; overfly at 105 KIAS / 15° flaps"], ["Gear", "DOWN if smooth/hard; UP if rough/soft"], ["Surface", "Smooth grass-covered runway if possible"], ["Approach", "105 KIAS / 15° flaps"], ["Switches except mags", "OFF"], ["Cabin Door", "UNLATCH before flare"], ["Mixtures", "IDLE CUT-OFF"], ["Magnetos", "OFF"], ["Fuel Selectors", "OFF"], ["Emergency Cross Feed", "OFF — PULL UP"], ["Landing Attitude", "NOSE HIGH"], ["WITHOUT POWER — Initial Approach", "120 KIAS"], ["Gear on smooth/hard surface", "DOWN within gliding distance"], ["GEAR HYD CB", "PULL"], ["Emergency Gear T-handle", "PULL"], ["Gear Down Lights", "ON; UNLOCKED OFF"], ["Gear Warning Horn", "CHECK"], ["Flaps", "AS REQUIRED"], ["Approach", "105 KIAS"], ["Battery", "OFF"], ["Rough / soft surface", "Gear UP • Flaps 15° • 105 KIAS • Battery OFF • NOSE HIGH"]], "FIRE / SMOKE": [["GROUND — Throttles", "CLOSE"], ["Brakes", "AS REQUIRED"], ["Mixtures", "IDLE CUT-OFF"], ["Battery", "OFF — USE GANG BAR"], ["Magnetos", "OFF — USE GANG BAR"], ["Evacuate", "ASAP"], ["INFLIGHT — Aux Fuel Pumps", "BOTH OFF"], ["Operative Engine Fuel Selector", "MAIN TANK — FEEL FOR DETENT"], ["Emergency Cross Feed", "OFF — PULL UP"], ["Affected Engine", "SECURE"], ["Engine secure sequence", "Throttle CLOSE • Mixture ICO • Prop FEATHER • Fuel OFF • Mags OFF • Alt OFF • Cowl CLOSE"], ["Cabin Heater", "OFF"], ["Land / Evacuate", "ASAP"], ["CABIN FIRE/SMOKE — Electrical Load", "REDUCE TO MINIMUM"], ["Wemacs", "OPEN"], ["Cabin Air", "OPEN ALL VENTS INCLUDING WINDSHIELD DEFROST"], ["If smoke increases", "CLOSE VENTS"], ["Window caution", "Opening foul-weather/emergency exit window may intensify fire"]], "LANDING GEAR": [["HYD PRESS after cycle", "RAPIDLY INCREASE GEAR SWITCH"], ["If HYD PRESS remains", "Gear DOWN • GEAR HYD CB PULL"], ["If light remains", "LAND AS SOON AS PRACTICAL"], ["Gear will not extend — Airspeed", "130 KIAS OR LESS"], ["Gear Switch", "DOWN"], ["GEAR HYD CB", "PULL"], ["Emergency Gear T-handle", "PULL"], ["Gear Down Lights", "ON; UNLOCKED OFF"], ["Main gear not locked", "YAW AIRPLANE"], ["Gear Warning Horn", "CHECK"], ["Landing", "AS SOON AS PRACTICAL"], ["CAUTION", "Gear cannot retract in flight after emergency T-handle is pulled"], ["Gear will not retract hydraulically", "Gear DOWN • Down lights ON • Horn CHECK • LAND ASAP"]], "ELECTRICAL": [["SINGLE — Failure indication", "FAILURE LIGHT"], ["Electrical Load", "REDUCE"], ["CB tripped", "Affected alternator OFF → reset CB → alternator ON"], ["If CB reopens", "Affected alternator OFF"], ["CB not tripped", "Select affected alternator on voltammeter; monitor output"], ["Normal output + failure light", "Disregard indication; have indicator checked after landing"], ["Insufficient output", "Alternator OFF; reduce load to one alternator capacity"], ["Complete loss", "Check field fuse; replace as necessary"], ["Intermittent light + voltmeter fluctuation", "Affected alternator OFF; reduce load"], ["DUAL — Indication", "Failure lights + LOW VOLTAGE"], ["Load", "REDUCE"], ["CBs tripped", "Alternators OFF → reset CBs → LEFT ON / monitor"], ["If charging", "Leave ON; disregard failure"], ["If still inop", "Left OFF; repeat for right"], ["If CBs reopen", "Prepare to terminate flight"], ["CBs not tripped", "Alternators OFF → check field fuses"], ["Both still inop", "Alternators OFF → EMERGENCY ALTERNATOR FIELD ON"], ["Still inop", "Turn alternator OFF and prepare to terminate flight"]]}, "speeds": [["VNE", "235 KIAS"], ["VNO", "205 KIAS"], ["VMCA", "69 KIAS"], ["VYSE", "107 KIAS"], ["VA", "152 KIAS"], ["VFE", "180 / 149 KIAS*"], ["VLO / VLE", "180 KIAS"], ["VX", "84 KIAS"], ["VY", "112 KIAS"], ["VSO", "72 KIAS"], ["VS1", "81 KIAS"], ["VTOSS", "95 KIAS"], ["GLIDE", "117 KIAS"], ["VREF", "95 KIAS"], ["MAX CROSSWIND", "15 KTS"], ["MAX RAMP", "3289 KG"], ["MAX TAKEOFF", "3277 KG"], ["MAX LANDING", "3113 KG"], ["MZFW", "3050 KG"], ["USABLE FUEL", "775 L"]], "power": [["TAKE OFF", "39\" / 2700 RPM", "300 L/hr • 79 gal/hr • Pumps ON • Cowl OPEN"], ["<500 FT", "35\" / 2600 RPM", "270 L/hr • 71 gal/hr • Pumps OFF • Cowl OPEN"], ["ENROUTE CLIMB", "32\" / 2600 RPM", "220 L/hr • 58 gal/hr • Pumps OFF • Cowl OPEN"], ["9000 FT CRUISE", "28\" / 2300 RPM", "150 L/hr • 39 gal/hr • Pumps OFF • UCI OPEN"], ["PASSING 10,000 FT", "29\" / 2450 RPM", "180 L/hr • 47 gal/hr • Pumps ON • Cowl OPEN"], ["SURVEY", "28\"–26\" / 2300 RPM", "130 L/hr • 34 gal/hr • Pumps ON • VIDL CLOSER/OPEN • ZDS UCI CLOSE"], ["DESCENT", "28\"–23\" / 2400 RPM", "100 L/hr • 26 gal/hr • Pumps ON • Cowl CLOSED"], ["APPROACH", "23\" / 2400 RPM", "100 L/hr • 26 gal/hr • Pumps ON • Cowl OPEN"]]};
const state=JSON.parse(localStorage.getItem('c402_v4_state')||'{}');
let current={type:null,index:null};
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem('c402_v4_state',JSON.stringify(state));}
function home(){
app.innerHTML=`<header><h1>CESSNA 402C</h1><div class="sub">HANDEL AVIATION • DIGITAL CHECKLIST</div></header><main>
<div class="section">AIRCRAFT DATA</div><div class="grid">
<button class="big data" onclick="showData()">V-SPEEDS &amp; WEIGHTS</button>
<button class="big data" onclick="showFuel()">FUEL — 775 L</button>
<button class="big data" onclick="showPower()">POWER SETTINGS</button>
</div>
<div class="section">NORMAL OPERATIONS</div><div class="grid">
${Object.keys(DATA.normal).map((x,i)=>`<button class="big" onclick="showChecklist('n',${i})">${esc(x)}</button>`).join('')}
</div>
<div class="note">REFERENCE ONLY — USE IN CONJUNCTION WITH THE AIRCRAFT POH/AFM. Checklist wording is currently a working draft and will be reviewed line-by-line.</div>
</main>`;}
function showChecklist(type,i){
const source=type==='n'?DATA.normal:DATA.emergency;const key=Object.keys(source)[i];const rows=source[key];const emer=type==='e';current={type,index:i};
const prefix=(emer?'e':'n')+i;const done=rows.reduce((n,_,j)=>n+(state[prefix+'-'+j]?1:0),0);
app.innerHTML=`<header class="${emer?'red':''}"><h1>${esc(key)}</h1><div class="sub">${emer?'EMERGENCY CHECKLIST':'NORMAL CHECKLIST'}</div></header><main>
<div class="toolbar"><button class="back" onclick="home()">← MENU</button><button class="tool reset" onclick="resetChecklist('${prefix}')">RESET</button></div>
${emer?'<div class="emergency-title">FOLLOW THE SEQUENCE • FLY THE AIRCRAFT</div>':''}
<div class="progress"><span>TAP ANYWHERE ON A CARD TO CHECK</span><span id="prog">${done} / ${rows.length} COMPLETE</span></div>
<div class="progressbar"><span id="pbar" style="width:${rows.length?done/rows.length*100:0}%"></span></div>
<div class="checkgrid ${emer?'single':''}">
${rows.map((r,j)=>{let k=prefix+'-'+j,ck=!!state[k];return `<label class="card ${ck?'done':''}" onclick="toggle(event,'${k}',${rows.length},'${prefix}')"><input type="checkbox" ${ck?'checked':''} aria-label="Complete ${esc(r[0])}"><div class="label">${esc(r[0])}</div><div class="value">${esc(r[1])}</div></label>`}).join('')}
</div></main>`;}
function toggle(e,k,total,prefix){
if(e.target.tagName==='INPUT'){state[k]=e.target.checked}else{state[k]=!state[k]}
save();const card=e.currentTarget;card.classList.toggle('done',!!state[k]);const cb=card.querySelector('input');cb.checked=!!state[k];
const n=Object.keys(state).filter(x=>x.startsWith(prefix+'-')&&state[x]).length;
document.getElementById('prog').textContent=n+' / '+total+' COMPLETE';
document.getElementById('pbar').style.width=(n/total*100)+'%';
}
function resetChecklist(prefix){
Object.keys(state).filter(k=>k.startsWith(prefix+'-')).forEach(k=>delete state[k]);save();showChecklist(current.type,current.index);
}
function openEmergency(i){showChecklist('e',i)}
function showData(){
app.innerHTML=`<header><h1>V-SPEEDS &amp; WEIGHTS</h1><div class="sub">AIRCRAFT DATA</div></header><main><button class="back" onclick="home()">← MENU</button>
${DATA.speeds.map(r=>`<div class="row"><span>${esc(r[0])}</span><b>${esc(r[1])}</b></div>`).join('')}
<div class="note">* VFE: check aircraft markings. Usable fuel: 775 L total.</div></main>`;}
function showFuel(){
app.innerHTML=`<header><h1>FUEL QUANTITY</h1><div class="sub">AIRCRAFT DATA</div></header><main><button class="back" onclick="home()">← MENU</button>
<div class="hero"><div>USABLE FUEL</div><div class="num">775 L</div><strong>TOTAL USABLE FUEL</strong></div>
<div class="note">Fuel-flow references are in Power Settings. No tank-capacity split has been added because none was supplied.</div></main>`;}
function showPower(){
app.innerHTML=`<header><h1>POWER SETTINGS</h1><div class="sub">VID / ZDS / UCI • 15,000 FT</div></header><main><button class="back" onclick="home()">← MENU</button>
${DATA.power.map(r=>`<div class="powercard"><div class="phase">${esc(r[0])}</div><div class="mp">${esc(r[1])}</div><div class="detail">${esc(r[2])}</div></div>`).join('')}
<div class="note">3° approach: NM = ALT TO LOSE × 3 • 3° approach CC: ALT TO LOSE = NM TO RUN × 3 • 500 ft/min: NM = ALT TO LOSE × 0.5 • 1000 ft/min @ 120 kt = 2 NM</div></main>`;}
home();
</script>
</body></html>
