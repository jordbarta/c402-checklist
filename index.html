<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Digital Checklist</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f6f8;color:#183b5d}
header{background:#285782;color:#fff;padding:20px 16px;box-shadow:0 2px 7px #0002;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:28px;letter-spacing:.04em}h2{margin:5px 0 0;font-size:15px;font-weight:700;letter-spacing:.09em;color:#dce8f3}
main{max-width:900px;margin:auto;padding:16px 14px 95px}.section{font-size:14px;font-weight:900;letter-spacing:.12em;color:#667582;margin:14px 2px 9px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{width:100%;background:#fff;border:1px solid #d5dde4;border-radius:16px;padding:16px 14px;text-align:left;color:#183b5d;font-size:17px;font-weight:850;box-shadow:0 1px 2px #0001}
.big:active{transform:scale(.99)}.back{border:0;background:#e7edf2;color:#183b5d;border-radius:11px;padding:10px 14px;font-weight:850;margin-bottom:9px}
.check{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #d5dde4;border-radius:13px;padding:9px 11px;margin:6px 0;min-height:52px;color:#17324a;font-size:16px}
.check input{width:24px;height:24px;flex:0 0 24px;accent-color:#285782}.check.done{opacity:.5;text-decoration:line-through}
.card{background:#fff;border:1px solid #d5dde4;border-radius:15px;padding:13px;margin:8px 0}.card b{display:block;font-size:16px;margin-bottom:5px}.muted{color:#657582;font-size:13px}
.danger{border-left:5px solid #c93434}.warn{border-left:5px solid #d79b22}.note{background:#eef3f7;border-radius:12px;padding:11px;margin-top:12px;color:#5c6c77;font-size:13px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #d5dde4;padding:9px;display:flex;gap:7px;z-index:8}.bottom button{flex:1;border:1px solid #e0b1b1;background:#fff5f5;color:#b32929;border-radius:11px;padding:11px 3px;font-weight:900}
@media(max-width:600px){.grid{grid-template-columns:1fr}.big{padding:15px}.check{font-size:16px}}
</style>
</head>
<body>
<header><h1 id="title">DIGITAL CHECKLIST</h1><h2 id="sub">SELECT AIRCRAFT</h2></header>
<main><div id="app"></div></main>
<div class="bottom"><button>ENG FAIL</button><button>FIRE</button><button>GEAR</button><button>ELEC</button></div>

<script>
const F={
C402:{
normal:{
"PRE-FLIGHT":["Aircraft exterior — INSPECT","Aircraft interior — INSPECT","Documents — CHECK","Seats / belts / harnesses — CHECK","Fire extinguishers — CHECK","Control locks — REMOVED","Flight controls — CHECK","Fuel quantity — CHECK","Fuel caps / vents — CHECK","Landing gear — CHECK","Oil quantity — CHECK","Electrical equipment — CHECK","Avionics / circuit breakers — CHECK","Emergency equipment — CHECK"],
"START":["Parking brake — SET","Battery / electrical — CHECK","Fuel selectors — CHECK","Mixtures — RICH","Propellers — FULL FINE","Cowl flaps — AS REQUIRED","Circuit breakers — CHECK","Area — CLEAR","Fuel pumps — AS REQUIRED","Starter — ENGAGE","Oil pressure — CHECK","Alternator / generator — CHECK","Engine instruments — CHECK"],
"TAXI":["Brakes — CHECK","Flight instruments — CHECK","Engine instruments — CHECK","Flight controls — CHECK","Trim — SET"],
"BEFORE TAKE-OFF / RUN UPS":["Flight controls — FREE","Trim — SET","Flaps — SET","Fuel selectors — CHECK","Mixtures — SET","Propellers — FULL FINE","Engine run-up — COMPLETE","Magnetos — CHECK","Maximum drop — 150 RPM per magneto","Maximum L/R difference — 50 RPM","Vacuum / electrical — CHECK","Doors / windows — SECURE"],
"TAKE-OFF":["Power — SET","Engine instruments — CHECK","Airspeed — ALIVE"],
"CLIMB":["Power — SET","Mixtures — SET","Cowl flaps — AS REQUIRED","Propellers — SYNCHRONISE","Engine instruments — MONITOR"],
"CRUISE":["Power — SET","Mixtures — SET","Cowl flaps — AS REQUIRED","Propellers — SYNCHRONISE","Engine instruments — MONITOR"],
"DESCENT":["Power — AS REQUIRED","Mixtures — AS REQUIRED","Cowl flaps — AS REQUIRED","Engine instruments — MONITOR"],
"LANDING":["Fuel selectors — CHECK","Mixtures — AS REQUIRED","Propellers — AS REQUIRED","Landing gear — DOWN / CHECK","Flaps — AS REQUIRED","Cowl flaps — AS REQUIRED"],
"AFTER LANDING":["Flaps — UP","Cowl flaps — AS REQUIRED","Trim — SET","Fuel pumps — AS REQUIRED"],
"SECURE":["Parking brake — SET","Avionics — OFF","Electrical — OFF","Mixtures — IDLE CUT-OFF","Magnetos — OFF","Master — OFF"]
},
refs:{
"V-SPEEDS":["VNE 235 KIAS","VNO 205 KIAS","VMCA 69 KIAS (80 KIAS without VGs)","VTOSS 95 KIAS","VYSE 107 KIAS","VA 152 KIAS","VLO 180 KIAS","VLE 180 KIAS","Cruise 180 KIAS","Cruise climb 120 KIAS","VFE flap 15° 180 KIAS","VFE flap 45° 149 KIAS","Max demonstrated crosswind 15 kt"],
"FUEL":["Usable fuel — 775 L","Start / taxi / take-off — 22 L","Climb — 148 L/hr","Cruise / descent — 89–137 L/hr","Variable reserve — 15% of flight fuel","Fixed reserve — 78 L (45 min @ 104 L/hr)","Alternate / holding — as required by applicable procedures"],
"POWER":["Maximum-performance climb — 32 in / 2600 RPM","Maximum climb — 39 in / 2600 RPM","Cruise climb / 75% — 29.5 in / 2450 RPM","Survey — cowl flaps AS REQUIRED"]
},
trouble:["NO INS SOLN — fly a figure 8 to reset/re-establish the solution.","PAUSED (NO INS SOLN) — fly a figure 8 to reset/re-establish the solution."],
emergency:["Engine failure","Engine fire","Landing gear malfunction","Electrical failure"]
},
C210:{
normal:{
"PRE-FLIGHT":["Aircraft exterior — INSPECT","Aircraft interior — INSPECT","Documents — CHECK","Fuel quantity / caps / vents — CHECK","Oil quantity — CHECK","Landing gear — CHECK","Flight controls — CHECK","Emergency equipment — CHECK"],
"BEFORE START":["Parking brake — SET","Battery / electrical — CHECK","Fuel selector — CHECK","Mixture — RICH","Propeller — FULL FINE"],
"ENGINE START":["Area — CLEAR","Fuel pump — AS REQUIRED","Starter — ENGAGE","Oil pressure — CHECK","Alternator — CHECK"],
"TAXI":["Brakes — CHECK","Flight instruments — CHECK","Engine instruments — CHECK","Flight controls — CHECK"],
"BEFORE TAKE-OFF / RUN UPS":["Flight controls — FREE","Trim — SET","Flaps — SET","Fuel selector — CHECK","Mixture — SET","Propeller — FULL FINE","Engine run-up — COMPLETE"],
"TAKE-OFF":["Power — SET","Engine instruments — CHECK","Airspeed — ALIVE"],
"CLIMB":["Power — SET","Mixture — SET","Engine instruments — MONITOR"],
"CRUISE":["Power — SET","Mixture — SET","Engine instruments — MONITOR"],
"DESCENT":["Power — AS REQUIRED","Mixture — AS REQUIRED","Engine instruments — MONITOR"],
"LANDING":["Fuel selector — CHECK","Mixture — AS REQUIRED","Propeller — AS REQUIRED","Landing gear — DOWN / CHECK","Flaps — AS REQUIRED"],
"AFTER LANDING":["Flaps — UP","Trim — SET"],
"SECURE":["Avionics — OFF","Electrical — OFF","Mixture — IDLE CUT-OFF","Magneto — OFF","Master — OFF"]
},
refs:{
"V-SPEEDS":["VNE 200 KIAS","VNO 165 KIAS","VTOSS 74 KIAS (MAUW)","Gear extension 165 KIAS","Gear retraction 165 KIAS","Max speed gear extended 200 KIAS","Cruise 145 KIAS","Cruise climb 105 KIAS","VFE flap 10° 160 KIAS","VFE flap 20° 130 KIAS","VFE flap 30° 115 KIAS","Max demonstrated crosswind 21 kt"],
"FUEL":["342 L total / 330 L usable","Start / taxi / take-off — 8 L","Flight fuel — 60 L/hr","Fixed reserve — 45 L (45 min @ 60 L/hr)","Variable reserve — 15% of flight fuel","Alternate / holding — as required by applicable procedures"],
"POWER":["75% max power — 60 L/hr @ 8000 ft","65% max power — 51 L/hr @ 8000 ft","55% max power — 45 L/hr @ 8000 ft","Oil — 11 qt capacity; minimum 7 qt"]
},
trouble:[],emergency:["Engine failure","Engine fire","Landing gear malfunction"]
},
C310:{
normal:{
"PRE-FLIGHT":["Aircraft exterior — INSPECT","Aircraft interior — INSPECT","Documents — CHECK","Fuel quantity / caps / vents — CHECK","Oil quantity — CHECK","Landing gear — CHECK","Flight controls — CHECK","Emergency equipment — CHECK"],
"BEFORE START":["Parking brake — SET","Battery / electrical — CHECK","Fuel selectors — CHECK","Mixtures — RICH","Propellers — FULL FINE"],
"ENGINE START":["Area — CLEAR","Fuel pumps — AS REQUIRED","Starter — ENGAGE","Oil pressure — CHECK","Alternators — CHECK"],
"TAXI":["Brakes — CHECK","Flight instruments — CHECK","Engine instruments — CHECK","Flight controls — CHECK"],
"BEFORE TAKE-OFF / RUN UPS":["Flight controls — FREE","Trim — SET","Flaps — SET","Fuel selectors — CHECK","Mixtures — SET","Propellers — FULL FINE","Engine run-up — COMPLETE"],
"TAKE-OFF":["Power — SET","Engine instruments — CHECK","Airspeed — ALIVE"],
"CLIMB":["Power — SET","Mixtures — SET","Propellers — SYNCHRONISE","Engine instruments — MONITOR"],
"CRUISE":["Power — SET","Mixtures — SET","Propellers — SYNCHRONISE","Engine instruments — MONITOR"],
"DESCENT":["Power — AS REQUIRED","Mixtures — AS REQUIRED","Engine instruments — MONITOR"],
"LANDING":["Fuel selectors — CHECK","Mixtures — AS REQUIRED","Propellers — AS REQUIRED","Landing gear — DOWN / CHECK","Flaps — AS REQUIRED"],
"AFTER LANDING":["Flaps — UP","Trim — SET"],
"SECURE":["Avionics — OFF","Electrical — OFF","Mixtures — IDLE CUT-OFF","Magnetos — OFF","Master — OFF"]
},
refs:{
"V-SPEEDS":["VNE 223 KIAS","VNO 181 KIAS","VA 148 KIAS","VMCA 71 KIAS","VTOSS 92 KIAS","VYSE 106 KIAS","VLO 138 KIAS","VLE 138 KIAS","Cruise 180 KIAS","Cruise climb 130 KIAS","VFE flap 0–15° 158 KIAS","VFE flap 15–35° 139 KIAS","Max demonstrated crosswind 19 kt"],
"FUEL":["619 L usable total","Start / taxi / take-off — 18 L","Climb — 135 L/hr","Cruise / descent — 75–119 L/hr","Variable reserve — 15% of flight fuel","Fixed reserve — 78 L (45 min @ 104 L/hr)","Alternate / holding — as required by applicable procedures"],
"POWER":["Take-off — Full throttle / 2700 RPM / 92–95 LPH","Climb — 24.5 in / 2500 RPM / 68 LPH","Cruise 65% — 21 in / 2400 RPM / 51 LPH","Cruise 50% — 16 in / 2400 RPM / 41 LPH","Cruise 45% — 16 in / 2300 RPM / 39 LPH","Descent — as required, same RPM as cruise","Do not reduce throttle more than 2 in at a time; aim about 1 in/min","Monitor EGTs / CHTs and adjust fuel flow as required"]
},
trouble:[],emergency:["Engine failure","Engine fire","Landing gear malfunction","Electrical failure"]
},
"C310 TURBO":{normal:{},refs:{"V-SPEEDS":["Source material required"],"FUEL":["Source material required"],"POWER":["Source material required"]},trouble:[],emergency:["Source material required"]}
};

let aircraft=null;
const app=document.getElementById("app");
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function home(){aircraft=null;document.getElementById("title").textContent="DIGITAL CHECKLIST";document.getElementById("sub").textContent="SELECT AIRCRAFT";app.innerHTML=`<div class="section">AIRCRAFT</div><div class="grid">
<button class="big" onclick="openAircraft('C210')">C210</button>
<button class="big" onclick="openAircraft('C310')">C310</button>
<button class="big" onclick="openAircraft('C310 TURBO')">C310 TURBO</button>
<button class="big" onclick="openAircraft('C402')">C402</button></div>`}
function openAircraft(a){aircraft=a;document.getElementById("title").textContent=a;document.getElementById("sub").textContent="AIRCRAFT CHECKLIST";renderAircraft()}
function renderAircraft(){let d=F[aircraft];app.innerHTML=`<button class="back" onclick="home()">← BACK</button>
<div class="section">CHECKLISTS</div><div class="grid">${Object.keys(d.normal).map(k=>`<button class="big" onclick="showChecklist('${esc(k)}')">${esc(k)}</button>`).join("")}</div>
<div class="section">AIRCRAFT DATA</div><div class="grid">${Object.keys(d.refs).map(k=>`<button class="big" onclick="showRef('${esc(k)}')">${esc(k)}</button>`).join("")}</div>
${aircraft==="C402"?`<div class="section">SURVEY</div><div class="grid"><button class="big" onclick="showTrouble()">SURVEY TROUBLESHOOTING</button></div>`:""}
<div class="section">EMERGENCY</div><div class="grid"><button class="big" onclick="showEmergency()">EMERGENCY PROCEDURES</button></div>`}
function showChecklist(k){let items=F[aircraft].normal[k]||[];app.innerHTML=`<button class="back" onclick="renderAircraft()">← BACK</button><div class="section">${esc(k)}</div>${items.map((x,i)=>`<label class="check"><input type="checkbox"><span>${i+1}. ${esc(x)}</span></label>`).join("")}`}
function showRef(k){let items=F[aircraft].refs[k]||[];app.innerHTML=`<button class="back" onclick="renderAircraft()">← BACK</button><div class="section">${esc(k)}</div>${items.map(x=>`<div class="card"><b>${esc(x)}</b></div>`).join("")}`}
function showTrouble(){app.innerHTML=`<button class="back" onclick="renderAircraft()">← BACK</button><div class="section">SURVEY TROUBLESHOOTING</div>${F.C402.trouble.map(x=>`<div class="card warn"><b>${esc(x)}</b></div>`).join("")}<div class="note">Working reference based on the survey-system behaviour you supplied. Confirm against current system/operator procedures.</div>`}
function showEmergency(){let items=F[aircraft].emergency||[];app.innerHTML=`<button class="back" onclick="renderAircraft()">← BACK</button><div class="section">EMERGENCY PROCEDURES</div>${items.map(x=>`<div class="card danger"><b>${esc(x)}</b></div>`).join("")}`}
home();
</script>
</body>
</html>
