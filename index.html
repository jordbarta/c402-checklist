<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#234E7D">
<title>C402C Digital Checklist</title>
<style>
:root{--blue:#234E7D;--pblue:#EAF1F8;--red:#C91C24;--pred:#FBE9EA;--text:#15181B;--muted:#68727C;--line:#D6DADF;--yellow:#FFF4CF;--green:#EAF3E6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f5f6f7;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,label{font-family:inherit}
#app{max-width:900px;margin:auto;min-height:100vh;padding-bottom:88px}
header{background:var(--blue);color:white;padding:16px 18px 15px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px #0002}
header.red{background:var(--red)}
h1{font-size:23px;line-height:1.05;margin:0;font-weight:900;letter-spacing:.01em}
.sub{font-size:11px;opacity:.82;margin-top:5px;font-weight:800;letter-spacing:.08em}
main{padding:16px}
.section{font-size:12px;color:var(--muted);font-weight:900;letter-spacing:.12em;margin:9px 2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{min-height:76px;border:1px solid var(--line);border-radius:17px;background:#fff;font-size:16px;font-weight:900;color:var(--blue);padding:12px}
.big.data{min-height:64px}
.big:active,.tool:active,.em:active{transform:scale(.985)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.back,.tool{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;font-weight:900;color:var(--blue);font-size:14px}
.tool.reset{color:var(--red)}
.progress{font-size:12px;color:var(--muted);font-weight:900;margin-bottom:13px;display:flex;justify-content:space-between;gap:10px}
.progressbar{height:7px;background:#e7eaed;border-radius:99px;overflow:hidden;margin-bottom:14px}
.progressbar span{display:block;height:100%;background:var(--blue);width:0%;transition:width .2s}
.checkgrid{display:grid;grid-template-columns:1fr;gap:10px}
.card{display:block;min-height:78px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:10px 14px;position:relative;text-align:left;user-select:none;box-shadow:0 1px 2px #0000000a;touch-action:pan-y}
.checkmark{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:3px solid var(--blue);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:950;color:var(--blue);padding:0;margin:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.checkmark:active{transform:translateY(-50%) scale(.94)}
.card.done .checkmark{background:var(--blue);color:#fff}
.card .label{font-size:18px;font-weight:950;padding-right:58px;line-height:1.12}
.card .num{display:inline-block;min-width:28px;color:var(--muted);font-weight:950}.card .value{font-size:17px;font-weight:850;color:var(--blue);margin-top:12px;line-height:1.2;padding-right:2px}
.card.done{background:var(--green);border-color:#b8cdb0}
.card.done .label,.card.done .value{opacity:.58;text-decoration:none}
.single{grid-template-columns:1fr}
.single .card{min-height:94px}.single .checkmark{width:44px;height:44px}
.single .card .label{font-size:18px}
.single .card .num{display:inline-block;min-width:28px;color:var(--muted);font-weight:950}.card .value{font-size:17px;margin-top:9px}
.emergency-title{background:var(--pred);border:1px solid #e3b4b7;color:var(--red);font-size:12px;font-weight:950;border-radius:12px;padding:10px 12px;margin-bottom:12px}
.embar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:9px 8px calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:7px;z-index:20}
.em{min-height:50px;border:1px solid #e2b2b5;border-radius:13px;background:var(--pred);color:var(--red);font-weight:950;font-size:12px}
.hero{background:#fff;border:1px solid var(--line);border-radius:20px;padding:25px;text-align:center}
.hero .num{font-size:52px;font-weight:950;color:var(--blue);line-height:1.05;margin:7px 0}
.row{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:8px;display:flex;justify-content:space-between;gap:12px;font-size:15px;font-weight:850}
.row b{color:var(--blue);text-align:right}
.powercard{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:11px}
.powercard .phase{font-size:12px;font-weight:950;color:var(--blue);letter-spacing:.06em}
.powercard .mp{font-size:23px;font-weight:950;margin-top:4px}
.powercard .detail{font-size:13px;color:var(--muted);font-weight:750;margin-top:5px;line-height:1.25}
.note{background:var(--yellow);border-radius:14px;padding:14px;font-size:12px;font-weight:800;line-height:1.35;margin-top:14px}
@media(max-width:650px){.card .label{font-size:18px}.card .num{display:inline-block;min-width:30px;color:var(--muted);font-weight:950}.card .value{font-size:17px}}
@media(min-width:800px){#app{max-width:980px}main{padding:20px}.card{min-height:128px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="embar">
<button class="em" onclick="openEmergency(0)">ENG FAIL</button>
<button class="em" onclick="openEmergency(3)">FIRE</button>
<button class="em" onclick="openEmergency(4)">GEAR</button>
<button class="em" onclick="openEmergency(5)">ELEC</button>
</div>

ding"], ["Insufficient output", "Alternator OFF; reduce load to one alternator capacity"], ["Complete loss", "Check field fuse; replace as necessary"], ["Intermittent light + voltmeter fluctuation", "Affected alternator OFF; reduce load"], ["DUAL — Indication", "Failure lights + LOW VOLTAGE"], ["Load", "REDUCE"], ["CBs tripped", "Alternators OFF → reset CBs → LEFT ON / monitor"], ["If charging", "Leave ON; disregard failure"], ["If still inop", "Left OFF; repeat for right"], ["If CBs reopen", "Prepare to terminate flight"], ["CBs not tripped", "Alternators OFF → check field fuses"], ["Both still inop", "Alternators OFF → EMERGENCY ALTERNATOR FIELD ON"], ["Still inop", "Turn alternator OFF and prepare to terminate flight"]]}, "speeds": [["VNE", "235 KIAS"], ["VNO", "205 KIAS"], ["VMCA", "69 KIAS"], ["VYSE", "107 KIAS"], ["VA", "152 KIAS"], ["VFE", "180 / 149 KIAS*"], ["VLO / VLE", "180 KIAS"], ["VX", "84 KIAS"], ["VY", "112 KIAS"], ["VSO", "72 KIAS"], ["VS1", "81 KIAS"], ["VTOSS", "95 KIAS"], ["GLIDE", "117 KIAS"], ["VREF", "95 KIAS"], ["MAX CROSSWIND", "15 KTS"], ["USABLE FUEL", "775.2 L"]], "power":[["TAKE OFF","39\" / 2700 RPM","Normal after-takeoff setting varies with requirements; POH notes 2450 RPM / 29.5 inHg as a normal after-takeoff setting."],["MAX PERFORMANCE CLIMB","32\" / 2600 RPM","Operational climb setting noted: 32 inHg / 2600 RPM."],["MAX CLIMB","39\" / 2600 RPM","Technical maximum climb power; POH specifies 39 inHg below 16,000 ft."],["CRUISE CLIMB / 75%","29.5\" / 2450 RPM","Top of green • 75% cruise power • 115–140 KIAS."],["SURVEY","28\"–26\" / 2300 RPM","130 L/hr • 34 gal/hr • Cowl Flaps AS REQUIRED"],["DESCENT","28\"–23\" / 2400 RPM","100 L/hr • 26 gal/hr • Cowl Flaps CLOSED"],["APPROACH","23\" / 2400 RPM","100 L/hr • 26 gal/hr • Cowl Flaps OPEN"]]};
const state=JSON.parse(localStorage.getItem('c402_v4_state')||'{}');
let current={type:null,index:null};
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem('c402_v4_state',JSON.stringify(state));}

function home(){
  app.innerHTML=`<header><h1>HANDEL AVIATION</h1><div class="sub">DIGITAL AIRCRAFT CHECKLIST</div></header><main>
  <div class="section">SELECT AIRCRAFT</div>
  <div class="grid">
    <button class="big" onclick="showAircraftUnavailable('C210')">C210</button>
    <button class="big" onclick="showAircraftUnavailable('C310')">C310</button>
    <button class="big" onclick="showAircraftUnavailable('C310 TURBO')">C310 TURBO</button>
    <button class="big" onclick="showC402()">C402</button>

  <div class="note">C402 is the current working aircraft. The other aircraft can be populated with their aircraft-specific data and procedures.</div>
  </main>`;
}
function showAircraftUnavailable(name){
  app.innerHTML=`<header><h1>${esc(name)}</h1><div class="sub">HANDEL AVIATION • DIGITAL CHECKLIST</div></header><main>
  <button class="back" onclick="home()">← MENU</button>
  <div class="hero"><div class="num">COMING SOON</div><strong>${esc(name)} CHECKLIST</strong>
  <div class="note">This aircraft has not been populated yet. C402 is the current working aircraft.</div></div></main>`;
}
function showC402(){
  app.innerHTML=`<header><h1>CESSNA 402C</h1><div class="sub">HANDEL AVIATION • DIGITAL CHECKLIST</div></header><main>
  <div class="section">AIRCRAFT DATA</div><div class="grid">
    <button class="big data" onclick="showData()">V-SPEEDS</button>
    <button class="big data" onclick="showFuel()">FUEL — 775.2 L</button>
    <button class="big data" onclick="showPower()">POWER SETTINGS</button>
  </div>
  <div class="section">SURVEY</div><div class="grid">
    <button class="big data" onclick="showSurveyTroubleshooting()">SURVEY TROUBLESHOOTING</button>
  </div>
  <div class="section">NORMAL OPERATIONS</div><div class="grid">
    ${Object.keys(DATA.normal).map((x,i)=>`<button class="big" onclick="showChecklist('n',${i})">${esc(x)}</button>`).join('')}
  </div>
  <div class="note">REFERENCE ONLY — USE WITH CURRENT POH/AFM AND OPERATOR PROCEDURES. Working draft for testing and review.</div>
  </main>`;
}
function showChecklist(type,i){
const source=type==='n'?DATA.normal:DATA.emergency;const key=Object.keys(source)[i];const rows=source[key];const emer=type==='e';current={type,index:i};
const prefix=(emer?'e':'n')+i;const done=rows.reduce((n,_,j)=>n+(state[prefix+'-'+j]?1:0),0);
app.innerHTML=`<header class="${emer?'red':''}"><h1>${esc(key)}</h1><div class="sub">${emer?'EMERGENCY CHECKLIST':'NORMAL CHECKLIST'}</div></header><main>
<div class="toolbar"><button class="back" onclick="home()">← MENU</button><button class="tool reset" onclick="resetChecklist('${prefix}')">RESET</button></div>
${emer?'<div class="emergency-title">FOLLOW THE SEQUENCE • FLY THE AIRCRAFT</div>':''}
<div class="progress"><span>TAP ✓ TO CHECK</span><span id="prog">${done} / ${rows.length} COMPLETE</span></div>
<div class="progressbar"><span id="pbar" style="width:${rows.length?done/rows.length*100:0}%"></span></div>
<div class="checkgrid ${emer?'single':''}">
${rows.map((r,j)=>{let k=prefix+'-'+j,ck=!!state[k];return `<div class="card ${ck?'done':''}" data-key="${k}" data-total="${rows.length}" data-prefix="${prefix}"><button class="checkmark" type="button" onclick="toggleCard(event,this)" aria-label="${ck?'Uncheck':'Check'} item ${j+1}" aria-pressed="${ck}">${ck?'✓':''}</button><div class="label"><span class="num">${j+1}.</span> ${esc(r[0])}</div><div class="value">${esc(r[1])}</div></div>`}).join('')}
</div></main>`;}
function updateProgress(total,prefix){
const n=Object.keys(state).filter(x=>x.startsWith(prefix+'-')&&state[x]).length;
const prog=document.getElementById('prog');const bar=document.getElementById('pbar');
if(prog) prog.textContent=n+' / '+total+' COMPLETE';
if(bar) bar.style.width=(n/total*100)+'%';
}
function toggleCard(e,button){
e.stopPropagation();
const card=button.closest('.card'),k=card.dataset.key,total=Number(card.dataset.total),prefix=card.dataset.prefix;
state[k]=!state[k];save();
card.classList.toggle('done',!!state[k]);
button.setAttribute('aria-pressed',String(!!state[k]));
button.setAttribute('aria-label',(state[k]?'Uncheck':'Check')+' item '+k.split('-').pop());
button.textContent=state[k]?'✓':'';
updateProgress(total,prefix);
}
function resetChecklist(prefix){
Object.keys(state).filter(k=>k.startsWith(prefix+'-')).forEach(k=>delete state[k]);save();showChecklist(current.type,current.index);
}
function openEmergency(i){showChecklist('e',i)}
function showData(){
app.innerHTML=`<header><h1>V-SPEEDS</h1><div class="sub">AIRCRAFT DATA</div></header><main><button class="back" onclick="home()">← MENU</button>
${DATA.speeds.map(r=>`<div class="row"><span>${esc(r[0])}</span><b>${esc(r[1])}</b></div>`).join('')}
<div class="note">* VFE: check aircraft markings. Weight figures are intentionally omitted because the fleet aircraft have different weights.</div></main>`;}

app.innerHTML=`<header><h1>FUEL</h1><div class="sub">AIRCRAFT DATA • FUEL POLICY</div></header><main><button class="back" onclick="home()">← MENU</button>
<div class="hero"><div>USABLE FUEL</div><div class="num">775.2 L</div><strong>TOTAL USABLE FUEL</strong></div>
<div class="section">FUEL POLICY</div>

function showSurveyTroubleshooting(){
  app.innerHTML=`<header><h1>SURVEY TROUBLESHOOTING</h1><div class="sub">QUICK REFERENCE • SURVEY SYSTEM</div></header>
  <main>
    <button class="back" onclick="showC402()">← MENU</button>
    <div class="powercard">
      <div class="phase">NO INS SOLN</div>
      <div class="mp">FIGURE 8</div>
      <div class="detail">If the survey display shows “Paused (No INS Soln)” / “No INS Soln”, fly a figure 8 to reset/re-establish the solution.</div>
    </div>
    <div class="powercard">
      <div class="phase">SUN ANGLE LOW</div>
      <div class="mp">FIGURE 8</div>
      <div class="detail">This can appear with the INS solution warning. Fly a figure 8 to reset/re-establish the solution.</div>
    </div>
    <div class="note">Working survey troubleshooting note based on observed aircraft/survey-system behaviour. Confirm against current operator/survey-system procedures before operational use.</div>
  </main>`;
}

function showPower(){
